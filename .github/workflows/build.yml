name: Build plugins

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            slug: linux-x64
            shell: bash
          - name: macOS universal
            os: macos-latest
            slug: macos-universal
            shell: bash
          - name: Windows x64
            os: windows-latest
            slug: windows-x64
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Windows toolchain (MSYS2 MinGW)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja zip

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libdbus-1-dev

      - name: Configure
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine checks (tuning, stability, MPE)
        run: ./build/pipe_render_test build/chord.wav

      - name: Load the built CLAP and play it (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -O1 -std=c++17 -Idpf/distrho/src/clap tests/clap_host_test.cpp -o clap_host_test -ldl
          ./clap_host_test build/bin/Pipe.clap

      - name: Sign (macOS, ad-hoc)
        if: runner.os == 'macOS'
        run: |
          for b in build/bin/Pipe.clap build/bin/Pipe.vst3 build/bin/Pipe.component build/bin/Pipe.lv2; do
            [ -e "$b" ] && codesign --force --deep --sign - "$b"
          done
          ls -la build/bin

      - name: Package
        run: |
          mkdir -p dist/Pipe
          cp -R build/bin/Pipe.clap build/bin/Pipe.vst3 build/bin/Pipe.lv2 dist/Pipe/
          [ -e build/bin/Pipe.component ] && cp -R build/bin/Pipe.component dist/Pipe/ || true
          cp README.md resources/OFL-VT323.txt dist/Pipe/
          cd dist
          zip -r -y ../Pipe-${{ matrix.slug }}.zip Pipe

      - uses: actions/upload-artifact@v4
        with:
          name: Pipe-${{ matrix.slug }}
          path: Pipe-${{ matrix.slug }}.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Pipe ${GITHUB_REF_NAME}" \
            --notes "Compiled plugins for Windows, macOS (Apple Silicon + Intel) and Linux. Download the zip for your system; installation steps are in the README."
