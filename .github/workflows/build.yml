name: Build plugins

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            slug: linux-x64
            shell: bash
          - name: macOS universal
            os: macos-latest
            slug: macos-universal
            shell: bash
          - name: Windows x64
            os: windows-latest
            slug: windows-x64
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Windows toolchain (MSYS2 MinGW)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja zip

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libdbus-1-dev

      - name: Configure
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine checks (tuning, stability, MPE)
        run: ./build/pipe_render_test build/chord.wav

      - name: Load the built CLAP and play it (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -O1 -std=c++17 -Idpf/distrho/src/clap tests/clap_host_test.cpp -o clap_host_test -ldl
          ./clap_host_test build/bin/Pipe.clap

      - name: Sign (macOS, ad-hoc)
        if: runner.os == 'macOS'
        run: |
          for b in build/bin/Pipe.clap build/bin/Pipe.vst3 build/bin/Pipe.component; do
            if [ -e "$b" ]; then codesign --force --deep --sign - "$b"; fi
          done
          for lib in build/bin/Pipe.lv2/*.dylib; do codesign --force --sign - "$lib"; done
          ls -la build/bin

      - name: Package
        run: |
          mkdir -p dist/Pipe
          cp -R build/bin/Pipe.clap build/bin/Pipe.vst3 build/bin/Pipe.lv2 dist/Pipe/
          [ -e build/bin/Pipe.component ] && cp -R build/bin/Pipe.component dist/Pipe/ || true
          cp README.md resources/OFL-VT323.txt dist/Pipe/
          cd dist
          zip -r -y ../Pipe-${{ matrix.slug }}.zip Pipe

      - uses: actions/upload-artifact@v4
        with:
          name: Pipe-${{ matrix.slug }}
          path: Pipe-${{ matrix.slug }}.zip

  release:
    name: Publish release
    needs: build
    # every push to main refreshes the release for the version in CMakeLists.txt
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(sed -nE 's/^project\(pipe VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          TAG="v${VER}"
          NOTES="Compiled plugins for Windows (x64), macOS (Apple Silicon + Intel) and Linux (x64): CLAP, VST3, LV2, and AU on macOS. Download the zip for your system; install steps are in the README. Built from ${GITHUB_SHA::7}."
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" artifacts/*/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pipe $TAG" \
            --notes "$NOTES"
