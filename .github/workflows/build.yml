name: Build plugins

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  irs:
    name: Measured rooms (OpenAIR)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python packages
        run: pip install numpy scipy
      - name: Download cache
        uses: actions/cache@v4
        with:
          path: ir-cache
          key: openair-${{ hashFiles('tools/prepare_irs.py') }}
          restore-keys: openair-
      - name: Download and prepare impulse responses
        run: |
          if ! python3 tools/prepare_irs.py --out irs --cache ir-cache; then
            echo "::warning::OpenAIR download failed - building with the lite rooms only"
            rm -rf irs
            python3 tools/prepare_irs.py --out irs --empty
          fi
          ls -la irs
          head -30 irs/IrMeta.hpp
      - uses: actions/upload-artifact@v4
        with:
          name: irs
          path: |
            irs/ir_blob.bin
            irs/IrMeta.hpp

  build:
    name: ${{ matrix.name }}
    needs: irs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            slug: linux-x64
            shell: bash
          - name: macOS universal
            os: macos-latest
            slug: macos-universal
            shell: bash
          - name: Windows x64
            os: windows-latest
            slug: windows-x64
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Keep line endings as committed (the DPF patch needs them)
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: irs
          path: irs

      - name: Windows toolchain (MSYS2 MinGW)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja zip git

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # The runner's default (Azure) package mirror has been unreachable for long stretches;
          # use the main Ubuntu archive for this job, including the manual's browser dependencies.
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libdbus-1-dev

      - name: Configure
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPIPE_IR_DIR="$PWD/irs" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPIPE_IR_DIR="$PWD/irs"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPIPE_IR_DIR="$PWD/irs"
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine checks (tuning, stability, MPE)
        run: ./build/pipe_render_test build/chord.wav

      - name: Every pipe speaks and is in tune (measured on the sound, 48 and 44.1 kHz)
        run: |
          ./build/pipe_pipes_test
          PIPE_TEST_FS=44100 ./build/pipe_pipes_test

      - name: Load the built CLAP and play it (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -O1 -std=c++17 -Idpf/distrho/src/clap tests/clap_host_test.cpp -o clap_host_test -ldl
          ./clap_host_test build/bin/Pipe.clap
          g++ -O1 -std=c++17 -Idpf/distrho/src/clap tests/clap_mpe_test.cpp -o clap_mpe_test -ldl
          ./clap_mpe_test build/bin/Pipe.clap

      # The user manual is rebuilt on every push, with fresh screenshots of this build's interface
      - name: Manual - screenshots (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb xdotool imagemagick libgl1-mesa-dri
          sudo apt-get install -y fonts-inter || echo "::warning::fonts-inter not available, using fallback font"
          docs/manual/screenshots.sh build/bin/Pipe.clap

      - name: Manual - node (Linux)
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Manual - render PDF (Linux)
        if: runner.os == 'Linux'
        run: |
          VER=$(sed -nE 's/^project\(pipe VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          cd docs/manual
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node render.js "$VER" ../../Pipe-User-Manual.pdf

      - name: Manual - upload (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Pipe-manual
          path: Pipe-User-Manual.pdf

      - name: Sign (macOS, ad-hoc)
        if: runner.os == 'macOS'
        run: |
          for b in build/bin/Pipe.clap build/bin/Pipe.vst3 build/bin/Pipe.component; do
            if [ -e "$b" ]; then codesign --force --deep --sign - "$b"; fi
          done
          for lib in build/bin/Pipe.lv2/*.dylib; do codesign --force --sign - "$lib"; done
          ls -la build/bin

      - name: Package
        run: |
          mkdir -p dist/Pipe
          cp -R build/bin/Pipe.clap build/bin/Pipe.vst3 build/bin/Pipe.lv2 dist/Pipe/
          [ -e build/bin/Pipe.component ] && cp -R build/bin/Pipe.component dist/Pipe/ || true
          cp README.md resources/OFL-VT323.txt third_party/pffft/LICENSE.txt dist/Pipe/
          mv dist/Pipe/LICENSE.txt dist/Pipe/LICENSE-pffft.txt
          cd dist
          zip -r -y ../Pipe-${{ matrix.slug }}.zip Pipe

      - uses: actions/upload-artifact@v4
        with:
          name: Pipe-${{ matrix.slug }}
          path: Pipe-${{ matrix.slug }}.zip

  release:
    name: Publish release
    needs: build
    # every push to main refreshes the release for the version in CMakeLists.txt
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Pipe-*
      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(sed -nE 's/^project\(pipe VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          TAG="v${VER}"
          NOTES="Compiled plugins for Windows (x64), macOS (Apple Silicon + Intel) and Linux (x64): CLAP, VST3, LV2, and AU on macOS. Download the zip for your system; install steps are in the README and in Pipe-User-Manual.pdf. Measured rooms: impulse responses from OpenAIR (Audiolab, University of York), CC BY 4.0. Built from ${GITHUB_SHA::7}."
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" artifacts/*/*.zip artifacts/*/*.pdf \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pipe $TAG" \
            --notes "$NOTES"
