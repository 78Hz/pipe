name: IR probe
on:
  push:
    branches: [ ir-probe ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the four spaces
        run: |
          pip install numpy >/dev/null
          python3 - <<'PY'
          import re, urllib.request, hashlib, struct, numpy as np, io
          B='https://webfiles.york.ac.uk/OPENAIR/IRs/'
          def ls(url):
              html=urllib.request.urlopen(url).read().decode('utf8','replace')
              return sorted(set(h for h in re.findall(r'href="([^"?/][^"]*)"', html)))
          def walk(url, depth=0):
              out=[]
              for h in ls(url):
                  if h.endswith('/') and depth<2: out+=walk(url+h, depth+1)
                  elif not h.endswith('/'): out.append(url+h)
              return out
          def wavinfo(data):
              i=12; fmt=None; chunks={}
              while i+8<=len(data):
                  cid=data[i:i+4]; sz=struct.unpack('<I',data[i+4:i+8])[0]
                  chunks[cid]=(i+8,sz); i+=8+sz+(sz&1)
              o,s=chunks[b'fmt ']; ftag,ch,sr,br,ba,bits=struct.unpack('<HHIIHH',data[o:o+16])
              if ftag==0xFFFE: ftag=struct.unpack('<H',data[o+24:o+26])[0]
              do,dsz=chunks[b'data']; raw=data[do:do+dsz]
              n=dsz//(ch*bits//8)
              if bits==24:
                  a=np.frombuffer(raw[:n*ch*3],dtype=np.uint8).reshape(-1,3).astype(np.int32)
                  x=(a[:,0]|(a[:,1]<<8)|(a[:,2]<<16)); x=np.where(x>=1<<23,x-(1<<24),x)/float(1<<23)
              elif bits==16: x=np.frombuffer(raw[:n*ch*2],dtype='<i2')/32768.0
              elif bits==32 and ftag==3: x=np.frombuffer(raw[:n*ch*4],dtype='<f4').astype(float)
              else: x=np.frombuffer(raw[:n*ch*4],dtype='<i4')/2.0**31
              return ftag,ch,sr,bits,x.reshape(-1,ch)
          for slug in ['st-andrews-church/','st-margarets-church-national-centre-early-music/','york-minster/','jack-lyons-concert-hall-university-york/']:
              print('=====',slug)
              files=walk(B+slug)
              for f in files:
                  if not re.search(r'\.(zip|xlsx|png|jpg|mp3)$', f, re.I): print('  ', f.replace(B,''))
              for f in files:
                  if f.lower().endswith('.txt'):
                      t=urllib.request.urlopen(f).read().decode('utf8','replace'); print('--- README', f.replace(B,'')); print(t[:1500])
              wavs=[f for f in files if f.lower().endswith('.wav') and '/examples/' not in f and 'b-format' in f.lower()]
              if not wavs: wavs=[f for f in files if f.lower().endswith('.wav') and '/examples/' not in f]
              for f in wavs[:12]:
                  d=urllib.request.urlopen(f).read()
                  ftag,ch,sr,bits,x=wavinfo(d)
                  w=x[:,0]; e=np.abs(w); on=int(np.argmax(e>0.3*e.max()))
                  edc=np.cumsum((w[on:]**2)[::-1])[::-1]; edc_db=10*np.log10(edc/edc[0]+1e-30)
                  def t(db): idx=np.where(edc_db<db)[0]; return idx[0]/sr if len(idx) else float('nan')
                  t5,t35=t(-5),t(-35); rt=2*(t35-t5) if t35==t35 else float('nan')
                  rms=[float(np.sqrt(np.mean(x[on:on+int(0.2*sr),c]**2))) for c in range(ch)]
                  print(f"  {f.replace(B,'')}: tag={ftag} ch={ch} sr={sr} bits={bits} len={len(w)/sr:.2f}s onset={on/sr*1000:.1f}ms (~{on/sr*343:.1f} m) T30~{rt:.2f}s ch_rms={['%.3f'%r for r in rms]} sha256={hashlib.sha256(d).hexdigest()}")
          PY
