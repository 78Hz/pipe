name: IR probe
on:
  push:
    branches: [ ir-probe ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List the file server
        run: |
          B=https://webfiles.york.ac.uk/OPENAIR/IRs/
          curl -sSL "$B" | grep -oE 'href="[^"?/][^"]*"' | sed 's/href="//;s/"$//' > dirs.txt
          wc -l dirs.txt; grep -iE 'andrew|margaret|minster|lyons|church|cathedral|hall|chapel|abbey' dirs.txt
          for d in $(grep -iE 'andrew|margaret|minster|lyons' dirs.txt); do
            echo "=== $d"
            curl -sSL "$B$d" | grep -oE 'href="[^"?/][^"]*"|[0-9]{2}-[A-Za-z]{3}-[0-9]{4}[^<]*[0-9.]+[KMG]?' | sed 's/href="//;s/"$//' | head -40
            for sub in $(curl -sSL "$B$d" | grep -oE 'href="[^"?/][^"]*/"' | sed 's/href="//;s/"$//'); do
              echo "  --- $d$sub"; curl -sSL "$B$d$sub" | grep -oE 'href="[^"?/][^"]*"' | sed 's/href="//;s/"$//' | head -60
            done
          done
