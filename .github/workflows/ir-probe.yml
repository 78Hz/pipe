name: IR probe
on:
  push:
    branches: [ ir-probe ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at the pages
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          curl -sSLk "https://www.openair.hosted.york.ac.uk/?page_id=683" -o p.html; sed -e 's/<[^>]*>/ /g' p.html | tr -s ' \n' | head -c 1500; echo
          curl -sSLk -A "$UA" "https://www.openair.hosted.york.ac.uk/?page_id=683" -o p2.html; echo "UA size $(stat -c %s p2.html)"
          curl -sSLk -A "$UA" "https://www.openair.hosted.york.ac.uk/wp-json/wp/v2/pages/683" -o j.json; echo "json size $(stat -c %s j.json)"; head -c 600 j.json; echo
          for f in p2.html j.json; do echo "== links in $f"; grep -oE 'https?:[^"'"'"' <>\\]*' $f | sed 's#\\/#/#g' | grep -iE 'zip|wav|webfiles|OPENAIR' | sort -u | head -40; done
          echo "== webfiles index"; curl -sSL "https://webfiles.york.ac.uk/OPENAIR/IRs/" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 3000; echo
          for slug in st-andrews-church st-margarets-church york-minster jack-lyons-concert-hall-university-of-york; do echo "== $slug"; curl -sSL "https://webfiles.york.ac.uk/OPENAIR/IRs/$slug/" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 1500; echo; done
